# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when called from nightly.yml, so a
# nightly run and a push to main never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: clang-format
        run: git ls-files '*.c' '*.h' | grep -v '^third_party/' | xargs pipx run clang-format==18.1.8 --dry-run --Werror
      - name: cppcheck (core)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck
          cppcheck --std=c99 --enable=warning,portability,performance --error-exitcode=1 --inline-suppr -I src src/core
      - name: license headers
        run: sh scripts/check-license.sh
      - name: version checks only in php_compat.h
        run: sh scripts/check-compat.sh
      - name: vendored code is unmodified
        run: sh scripts/check-vendor.sh
      - name: tests for CI scripts
        run: |
          sh tests/scripts/test-check-compat.sh
          sh tests/scripts/test-fuzz-harness.sh
          sh tests/scripts/test-release-scripts.sh
          sh tests/scripts/test-release-policy.sh
          sh tests/scripts/test-check-version.sh
          sh tests/scripts/test-smoke.sh
          sh tests/scripts/test-check-vendor.sh

  unit:
    name: unit (${{ matrix.cc }}${{ matrix.sanitize == '1' && ', asan+ubsan' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        sanitize: ['0', '1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make -C tests/unit CC="$CC" SANITIZE="$SANITIZE"
        env:
          CC: ${{ matrix.cc }}
          SANITIZE: ${{ matrix.sanitize }}

  unit-centos7:
    name: unit (CentOS 7, gcc 4.8.5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/src:ro" centos:7 sh /src/scripts/ci/unit-centos7.sh

  phpt:
    name: phpt ${{ matrix.php }}-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        variant: [cli, zts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/src:ro" "php:${PHP}-${VARIANT}" sh /src/scripts/ci/phpt.sh
        env:
          PHP: ${{ matrix.php }}
          VARIANT: ${{ matrix.variant }}

  phpt-asan:
    # 7.x images ship GCC 10, whose ASan runtime cannot be preloaded into the
    # stock PHP binary; 7.x is covered by phpt-asan-php7 below.
    name: phpt ${{ matrix.php }} (asan+ubsan)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/src:ro" "php:${PHP}-cli" sh /src/scripts/ci/phpt.sh --asan
        env:
          PHP: ${{ matrix.php }}

  phpt-asan-php7:
    # PHP built from source with -fsanitize=address loads extensions without
    # RTLD_DEEPBIND, so no shim is needed. PHP itself gets ASan only: UBSan
    # reports undefined behavior inside PHP 7.x that is not ours.
    name: phpt ${{ matrix.php }} (asan, sanitizer-built PHP)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.0', '7.4']
    env:
      PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache ASan PHP
        id: php-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/php-asan
          key: php-asan-${{ matrix.php }}-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('scripts/release/build-php.sh', 'scripts/release/php-versions.txt') }}
      - name: Build PHP with ASan
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          tarball=$(sh scripts/release/fetch-php.sh "$PHP" "$RUNNER_TEMP/php-src")
          EXTRA_CFLAGS="-fsanitize=address -fno-omit-frame-pointer" EXTRA_CONFIGURE="LDFLAGS=-fsanitize=address" \
            ASAN_OPTIONS=detect_leaks=0 sh scripts/release/build-php.sh "$tarball" nts "$RUNNER_TEMP/php-asan"
      - name: phpt under ASan
        run: PATH="$RUNNER_TEMP/php-asan/bin:$PATH" SRC="$PWD" sh scripts/ci/phpt.sh --asan-native

  phpt-valgrind:
    name: phpt 8.4 (valgrind)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          docker run --rm -v "$PWD:/src:ro" php:8.4-cli sh -c
          'apt-get update -qq && apt-get install -y -qq valgrind >/dev/null && sh /src/scripts/ci/phpt.sh --valgrind'

  phpt-arm64:
    name: phpt ${{ matrix.php }} (aarch64)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        php: ['7.0', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/src:ro" "php:${PHP}-cli" sh /src/scripts/ci/phpt.sh
        env:
          PHP: ${{ matrix.php }}

  # The only required status check for main. Requiring individual matrix jobs
  # would break whenever the matrix changes. Never add path filters to this
  # workflow: a required check that does not run blocks the PR forever.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, unit, unit-centos7, phpt, phpt-asan, phpt-asan-php7, phpt-valgrind, phpt-arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: All CI jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null
